name: Build Pixel 6 Sensi Lab APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Extract project
        run: unzip -o pixel6_sensi_android_apk_project.zip -d pixel6-project
      - name: Build APK
        run: gradle --no-daemon -p pixel6-project assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Pixel6-Sensi-Lab-APK
          path: pixel6-project/app/build/outputs/apk/debug/app-debug.apk
